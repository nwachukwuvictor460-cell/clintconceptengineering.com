<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — GadgetX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Gadget<span style="color:var(--gold)">X</span> Admin</h2>
      <p>Sign in to manage the store</p>
      <form id="adminLoginForm">
        <div class="form-group"><label>Email</label><input name="email" type="email" style="width:100%" required></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" style="width:100%" required></div>
        <button class="btn btn--gold" type="submit" style="width:100%;padding:10px;justify-content:center">Sign in</button>
      </form>
      <div class="hint">Demo credentials: <strong>admin@gadgetx.ng</strong> / <strong>admin123</strong></div>
    </div>
  </div>

  <script src="/js/products.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = window.Auth.adminLogin(fd.get("email"), fd.get("password"));
      if (!r.ok) { alert(r.error); return; }
      location.href = "/admin.html";
    });
  </script>
</body>
</html>
