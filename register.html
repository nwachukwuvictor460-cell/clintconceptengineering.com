<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — GadgetX</title>
  <meta name="description" content="Create your GadgetX account.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div data-header></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Create an account</h2>
      <p>Save your addresses, track orders, and build a wishlist.</p>
      <form id="regForm" novalidate>
        <div class="form-group"><label>Full name</label><input name="name" required><div class="error">Enter your name</div></div>
        <div class="form-group"><label>Email</label><input name="email" type="email" required><div class="error">Enter a valid email</div></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" minlength="6" required><div class="error">Password must be at least 6 characters</div></div>
        <button class="btn btn--gold btn--block" type="submit">Create account</button>
      </form>
      <div class="foot">Already have an account? <a href="/login.html">Sign in</a></div>
    </div>
  </div>
  <div data-footer></div>

  <script src="/js/products.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/chatbot.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target; const fd = new FormData(form);
      form.querySelectorAll(".form-group").forEach((g) => g.classList.remove("invalid"));
      const name = fd.get("name"), email = fd.get("email"), password = fd.get("password");
      let ok = true;
      if (!name.trim()) { form.name.closest(".form-group").classList.add("invalid"); ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.email.closest(".form-group").classList.add("invalid"); ok = false; }
      if (password.length < 6) { form.password.closest(".form-group").classList.add("invalid"); ok = false; }
      if (!ok) return;
      const r = window.Auth.register({ name, email, password });
      if (!r.ok) return window.toast(r.error, "warn");
      window.toast("Account created 🎉");
      setTimeout(() => (location.href = "/account.html"), 500);
    });
  </script>
</body>
</html>
